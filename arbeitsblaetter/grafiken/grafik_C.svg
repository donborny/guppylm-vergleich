<path d="M512,112 L512,146" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#pfb)"/>
<text x="519" y="140" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">+</text>
<line x1="560" y1="150" x2="586" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#pfb)"/>
<rect x="590" y="112" width="150" height="76" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="665.0" y="136.6" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">norm + lm_head</text>
<text x="665.0" y="154.6" font-size="12" fill="#6b7280" text-anchor="middle">Wahrscheinlichkeit</text>
<text x="665.0" y="172.6" font-size="12" fill="#6b7280" text-anchor="middle">für jedes Token</text>
<text x="20" y="280" font-size="12" fill="#6b7280" text-anchor="start">Gelernt wird nur, was in den Tabellen und Blöcken steht. Die Positionstabelle bleibt in Variante b fest.</text>
<text x="20" y="300" font-size="12" fill="#6b7280" text-anchor="start">Was das Modell „kann“, steckt also in Gewichten, die das Training an genau diese Daten angepasst hat.</text>
