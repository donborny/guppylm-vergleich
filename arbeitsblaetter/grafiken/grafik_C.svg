<path d="M332,112 L332,146" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#pfb)"/>
<text x="339" y="140" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">+</text>
<rect x="365" y="70" width="75" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="402.5" y="94.5" font-size="13" fill="#1f2937" text-anchor="middle">…</text>
<path d="M383,150 L383,112" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#pfb)"/>
<path d="M422,112 L422,146" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#pfb)"/>
<text x="429" y="140" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">+</text>
<rect x="455" y="70" width="75" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="492.5" y="94.5" font-size="13" fill="#1f2937" text-anchor="middle">Block 6</text>
