<path d="M197,211 L235,211 L235,169" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#pf)"/>
<line x1="251" y1="150" x2="560" y2="150" stroke="#2563eb" stroke-width="5"/>
<text x="405" y="178" font-size="12" fill="#2563eb" text-anchor="middle">Residualstrom: jeder Block addiert seinen Beitrag</text>
