<text x="107.5" y="72.5" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Token-ID → tok_emb</text>
<text x="107.5" y="90.5" font-size="12" fill="#6b7280" text-anchor="middle">eine gelernte Zeile</text>
<text x="107.5" y="108.5" font-size="12" fill="#6b7280" text-anchor="middle">je Token (384 Zahlen)</text>
<rect x="20" y="180" width="175" height="62" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="107.5" y="197.6" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Position → pos_emb</text>
<text x="107.5" y="215.6" font-size="12" fill="#6b7280" text-anchor="middle">Sinustabelle (fest)</text>
<text x="107.5" y="233.6" font-size="12" fill="#6b7280" text-anchor="middle">in Variante b</text>
<circle cx="235" cy="150" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="235" y="156" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">+</text>
