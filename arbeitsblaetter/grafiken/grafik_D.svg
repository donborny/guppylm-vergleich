<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" style="max-width:760px" font-family="Helvetica, Arial, sans-serif" role="img">
<rect x="0" y="0" width="760" height="320" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<defs><marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="pfa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker><marker id="pfb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker></defs>
<text x="20" y="30" font-size="15" fill="#1f2937" font-weight="bold">Ein Block mit Residualverbindung, und was sie für den Gradienten bedeutet</text>
<rect x="20" y="150" width="70" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="55.0" y="174.6" font-size="13" fill="#1f2937" text-anchor="middle">x</text>
<line x1="92" y1="170" x2="120" y2="170" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="120" cy="170" r="4" fill="#1f2937"/>
<path d="M120,170 L120,85 L400,85 L400,151" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#pfb)"/>
<text x="260" y="76" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">Residualweg: unveränderte Kopie</text>
<path d="M120,170 L120,240 L136,240" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#pf)"/>
<rect x="139" y="220" width="80" height="40" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="179.0" y="244.6" font-size="13" fill="#1f2937" text-anchor="middle">LayerNorm</text>
<line x1="221" y1="240" x2="236" y2="240" stroke="#6b7280" stroke-width="1.5" marker-end="url(#pf)"/>
<rect x="239" y="220" width="110" height="40" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="294.0" y="235.7" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">F: Attention</text>
<text x="294.0" y="252.7" font-size="11" fill="#6b7280" text-anchor="middle">oder FFN</text>
<path d="M351,240 L400,240 L400,189" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#pf)"/>
<circle cx="400" cy="170" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="176" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">+</text>
<line x1="416" y1="170" x2="432" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#pf)"/>
<rect x="435" y="150" width="76" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="473.0" y="174.2" font-size="12" fill="#1f2937" text-anchor="middle">x + F(x)</text>
<text x="265" y="300" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">Ableitung nach x:  1 + F′(x)</text>
<rect x="525" y="55" width="215" height="245" rx="7" fill="#f3f4f6" stroke="#e5e7eb"/>
<text x="632" y="80" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Gradient nach 6 Blöcken</text>
<text x="632" y="98" font-size="11" fill="#6b7280" text-anchor="middle">wenn jeder Block F′ = 0,1 hat</text>
<text x="540" y="130" font-size="12" fill="#1f2937" text-anchor="start" font-weight="bold">ohne Residual</text>
<text x="540" y="148" font-size="12" fill="#6b7280" text-anchor="start" font-family="Menlo, Consolas, monospace">0,1 · 0,1 · … = 0,1⁶</text>
<rect x="540" y="158" width="2" height="16" fill="#b45309"/>
<text x="550" y="171" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">0,000001</text>
<text x="540" y="210" font-size="12" fill="#1f2937" text-anchor="start" font-weight="bold">mit Residual</text>
<text x="540" y="228" font-size="12" fill="#6b7280" text-anchor="start" font-family="Menlo, Consolas, monospace">1,1 · 1,1 · … = 1,1⁶</text>
<rect x="540" y="238" width="135" height="16" fill="#2563eb"/>
<text x="681" y="251" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">≈ 1,77</text>
<text x="632" y="285" font-size="10.5" fill="#6b7280" text-anchor="middle">Die „1“ ist die Abkürzung über den Residualweg.</text>
</svg>