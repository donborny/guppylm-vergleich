<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" style="max-width:760px" font-family="Helvetica, Arial, sans-serif" role="img">
<rect x="0" y="0" width="760" height="300" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<defs><marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="pfa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker><marker id="pfb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker></defs>
<text x="20" y="30" font-size="15" fill="#1f2937" font-weight="bold">Ein Trainingsschritt: vorwärts, Verlust, rückwärts, ändern</text>
<rect x="20" y="62" width="124" height="60" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="82.0" y="87.5" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Batch x</text>
<text x="82.0" y="105.5" font-size="12" fill="#6b7280" text-anchor="middle">Token-IDs</text>
<rect x="168" y="62" width="124" height="60" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="230.0" y="87.5" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Embeddings</text>
<text x="230.0" y="105.5" font-size="12" fill="#6b7280" text-anchor="middle">tok_emb + pos_emb</text>
<rect x="316" y="62" width="124" height="60" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="378.0" y="87.5" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">6 Blöcke</text>
<text x="378.0" y="105.5" font-size="12" fill="#6b7280" text-anchor="middle">Attention, FFN</text>
<rect x="464" y="62" width="124" height="60" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="526.0" y="87.5" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">lm_head</text>
<text x="526.0" y="105.5" font-size="12" fill="#6b7280" text-anchor="middle">Logits je Token</text>
<rect x="612" y="62" width="124" height="60" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="674.0" y="87.5" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Verlust</text>
<text x="674.0" y="105.5" font-size="12" fill="#6b7280" text-anchor="middle">−ln p(richtig)</text>
<line x1="146" y1="92" x2="164" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#pfb)"/>
<line x1="294" y1="92" x2="312" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#pfb)"/>
<line x1="442" y1="92" x2="460" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#pfb)"/>
<line x1="590" y1="92" x2="608" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#pfb)"/>
<text x="20" y="52" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">① vorwärts: Zahlen fließen zum Verlust</text>
<path d="M674,124 C674,170 526,170 526,128" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfa)"/>
<path d="M526,124 C526,170 378,170 378,128" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfa)"/>
<path d="M378,124 C378,170 230,170 230,128" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfa)"/>
<path d="M230,124 C230,170 82,170 82,128" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfa)"/>
<text x="20" y="196" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">② rückwärts (backward): Gradienten ∂L/∂w fließen vom Verlust zurück</text>
<text x="20" y="213" font-size="12" fill="#6b7280" text-anchor="start">Jedes Gewicht erfährt, in welche Richtung es den Verlust erhöht.</text>
<rect x="20" y="228" width="720" height="52" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="380.0" y="249.6" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">③ optimierer.step(): jedes Gewicht macht einen kleinen Schritt gegen seinen Gradienten</text>
<text x="380.0" y="267.6" font-size="12" fill="#6b7280" text-anchor="middle">w ← w − Lernrate · (Gradient, von AdamW geglättet)</text>
</svg>